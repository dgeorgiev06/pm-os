name: forge/new-mode
version: 0.1.0
contract: task@1
author: dima
summary: Design a new mode for an installed pack, stage it, check it, and propose it for approval
verbs: [draft]
accepts:
  pack: string          # an installed pack, e.g. "pm"
  name: string          # the mode's short name, e.g. "release-notes"
  purpose: string       # what the mode should do, in the PM's words
  role: string?         # a role in that pack to run it; default: let the design pick
  into: string?         # a pack staged by forge/new-pack; set only by that mode
returns:
  staged: diff_ref
skill: SKILL.md
default_role: pack-architect
calls: []
grants: { repo: draft }
approval: before_execute
risk: medium
principles: [contract-first, smallest-unit, compose-dont-copy]
rubric:
  - The design names the existing modes, roles and principles it reuses
  - The golden task exercises the mode's main path and one gate or failure case
evals: evals/
