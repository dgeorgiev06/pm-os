name: forge
version: 0.2.1
contract: pack@1
author: dima
summary: Builds and reviews pm-os itself — new modes or packs, staged and checked before they land, and on-demand framework reviews
requires:
  core: ^0.2
depends: []
cos_section: COS-section.md    # appended to AGENTS.md while forge is installed
actions:                       # handlers `pmos action run` calls for approved actions
  repo.sync_pack: scripts/forge.py sync-action
exports:
  modes: [forge/new-mode, forge/new-pack, forge/review-framework]
  roles: [pack-architect]
  skills: [authoring]
  principles: [contract-first, smallest-unit, compose-dont-copy]
