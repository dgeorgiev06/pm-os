kind: conformance
name: send-forwarder
covers: [action:comms.send, script:scripts/send.py]
failure: true
desc: >-
  release-comms' comms.send handler hands each merged child action to cos/notify's handler: it refuses while
  pm-os.yaml maps no comms tool, records a verified send once one is mapped, and refuses an unknown recipient.
setup:
  copy:
    release/channels.yaml: channels.yaml
  files:
    act.json: '{"task_id": "T-20261025-911", "action": {"system": "comms", "op": "send", "idempotency_key": "T-20261025-911-customer-email-1", "payload": {"channel": "customer-email", "kind": "email", "recipient": "customers@example.test", "text": "Subject: 2.4 is out\n\nRouting rules are live.", "send_at": null}, "preview": "Subject: 2.4 is out"}}'
    bad.json: '{"task_id": "T-20261025-911", "action": {"system": "comms", "op": "send", "idempotency_key": "T-20261025-911-customer-email-2", "payload": {"channel": "customer-email", "kind": "email", "recipient": "evil@example.test", "text": "Routing rules are live.", "send_at": null}, "preview": "Routing rules are live."}}'
steps:
  - run: |
      PMOS_CHANNELS_FILE=channels.yaml $PY $PACK/scripts/send.py act.json
    expect: {exit: nonzero, stderr: 'comms.send is not configured'}
  - name: a comms tool is mapped
    run: |
      sed -i 's/comms:send: \[\]/comms:send: [mcp__slack__post_message]/' pm-os.yaml &&
      PMOS_CHANNELS_FILE=channels.yaml $PY $PACK/scripts/send.py act.json
    expect: {stdout: 'recorded: comms.send T-20261025-911-customer-email-1'}
  - run: |
      PMOS_CHANNELS_FILE=channels.yaml $PY $PACK/scripts/send.py bad.json
    expect: {exit: nonzero, stderr: "unknown recipient 'evil@example.test'"}
