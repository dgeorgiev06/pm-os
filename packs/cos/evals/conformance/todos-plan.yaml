kind: conformance
name: todos-plan
covers: [script:scripts/todos.py]
desc: >-
  `todos.py plan` fits open todos into the free hours, due date first, and lists what doesn't fit
  and what is overdue.
setup:
  copy: {todos.yaml: t.yaml}
steps:
  - run: |
      PMOS_TODOS_FILE=t.yaml $PY $PACK/scripts/todos.py plan --start 2026-10-26 --days 3 \
        --hours '{"2026-10-26": 2, "2026-10-27": 1, "2026-10-28": 1}' --json > plan.json && $PY - <<'PY'
      import json, sys
      p = json.load(open("plan.json"))
      days = {d: [e["id"] for e in es] for d, es in p["days"].items()}
      print(days, [e["id"] for e in p["overflow"]])
      ok = (days["2026-10-26"] == ["td-2", "td-1"] and days["2026-10-27"] == ["td-3"]
            and [e["id"] for e in p["overflow"]] == ["td-4"] and p["free_left"]["2026-10-28"] == 1)
      sys.exit(0 if ok else 1)
      PY
  - name: overdue items are listed
    run: PMOS_TODOS_FILE=t.yaml $PY $PACK/scripts/todos.py plan --start 2026-10-29 --days 2 --default-hours 6
    expect: {stdout: ['Overdue: td-2, td-1, td-3']}
