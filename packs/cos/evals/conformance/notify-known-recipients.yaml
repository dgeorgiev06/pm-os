kind: conformance
name: notify-known-recipients
covers: [mode:cos/notify, principle:cos:known-recipients, script:modes/notify/scripts/build_actions.py]
failure: true
desc: >-
  A draft cannot name a recipient: a recipient key is refused. Every recipient in a built messages file is
  a target listed in channels.yaml.
setup:
  copy:
    notify/channels.yaml: channels.yaml
    notify/draft-recipient.json: draft.json
    notify/draft-internal.json: draft-internal.json
steps:
  - run: PMOS_CHANNELS_FILE=channels.yaml $PY $PACK/modes/notify/scripts/build_actions.py --check draft.json
    expect: {exit: nonzero, output: "unknown key 'recipient'"}
  - name: recipients come from channels.yaml
    run: |
      PMOS_CHANNELS_FILE=channels.yaml $PY $PACK/modes/notify/scripts/build_actions.py build draft-internal.json --audience internal --task T-20261025-903 --out o &&
      $PY - <<'PY'
      import json, sys
      allowed = {"C0PRODUCT1", "customers@example.test", "partners@example.test"}
      got = {m["recipient"] for m in json.load(open("o/messages.json"))["messages"]}
      print("recipients from channels.yaml" if got <= allowed else f"unknown recipients: {got - allowed}")
      sys.exit(0 if got <= allowed else 1)
      PY
    expect: {stdout: 'recipients from channels.yaml'}
