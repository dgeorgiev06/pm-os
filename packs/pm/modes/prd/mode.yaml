name: pm/prd
version: 0.4.0
contract: task@1
author: dima
summary: Draft a PRD from a goal and references, written for institutional staking customers
verbs: [draft]
accepts:
  goal: string
  refs: list?          # jira:STK-412, doc:path/to/brief.md, url:...
  audience: string?    # defaults to custodians, banks, financial institutions
returns:
  prd: doc_ref
skill: SKILL.md
default_role: doc-writer
skills: [domain/prd-structure]   # how to write one well; the outline is the standard
calls: []
grants: { docs: draft, jira: read }
approval: before_publish
risk: medium
standard: {ref: prd, output: prd}   # pm:standards/prd: its sections and rules (done line `standard`) and judgment lines (standard-N)
principles: [testable-requirements, cite-customer-claims]
done:                   # the definition of done, beyond the standard's lines: every must holds, or the review fails
  must:
    - principle: testable-requirements
evals: evals/
