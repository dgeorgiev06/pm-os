name: pm/sprint-planning
version: 0.3.0
contract: task@1
author: dima
summary: Prioritize the next sprint, update the roadmap, plan the work and draft Jira tickets
verbs: [plan]
accepts:
  sprint: string        # e.g. "2026-S22"
  project: string       # Jira project key
  goals_hint: string?
  sprint_days: number?  # defaults to 10 working days
returns:
  ranking: doc_ref
  sprint_plan: doc_ref
  roadmap_diff: diff_ref
  ticket_actions: list
skill: SKILL.md
default_role: sprint-planner
roles: [roadmap-strategist]
calls: [pm/jira-tickets@^0.3]
merge_child_actions: true   # stage C in code: pmos appends the ticket child's actions to this result
grants: { jira: draft, roadmap: draft }   # proposes roadmap and ticket actions; writes happen only via the Operator after approval
approval: before_execute
risk: high
principles: [plan-to-capacity, explicit-trade-offs]
done:
  must:
    - code: "python packs/pm/modes/sprint-planning/scripts/check_plan.py {outputs_dir}/plan.json {outputs_dir}/capacity.json"
    - "The PM approved the ranking before planning started (gate 1)"
    - principle: plan-to-capacity
    - "Roadmap and ticket changes are proposed as actions for one approval"
  should:
    - "Every roadmap change in the diff traces to a ranked item"
evals: evals/
