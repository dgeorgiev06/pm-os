name: pm/sprint-planning
version: 0.2.1
contract: task@1
author: dima
summary: Prioritize the next sprint, update the roadmap, plan the work and draft Jira tickets
verbs: [plan]
accepts:
  sprint: string        # e.g. "2026-S22"
  project: string       # Jira project key
  goals_hint: string?
  sprint_days: number?  # defaults to 10 working days
returns:
  ranking: doc_ref
  sprint_plan: doc_ref
  roadmap_diff: diff_ref
  ticket_actions: list
skill: SKILL.md
default_role: sprint-planner
roles: [roadmap-strategist]
calls: [pm/jira-tickets@^0.2]
merge_child_actions: true   # stage C in code: pmos appends the ticket child's actions to this result
grants: { jira: read, roadmap: read }   # writes happen only via the Operator after approval
approval: before_execute
risk: high
principles: [plan-to-capacity, explicit-trade-offs]
rubric:
  - Priorities were approved by the PM before planning started (gate 1)
  - Every roadmap change in the diff traces to a ranked item
acceptance:             # the envelope's default when the CoS passes no --acceptance
  - "Ranking approved by the PM before planning"
  - "Committed points within capacity (check_plan.py passes)"
  - "Roadmap and ticket changes proposed as actions for one approval"
evals: evals/
