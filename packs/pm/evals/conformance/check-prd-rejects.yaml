kind: conformance
name: check-prd-rejects
covers: [script:modes/prd/scripts/check_prd.py, mode:pm/prd]
failure: true
desc: >-
  check_prd.py fails a PRD with missing sections, a gap in the requirement numbers or a TBD, and
  says what to fix; a missing file fails too.
steps:
  - run: $PY $PACK/modes/prd/scripts/check_prd.py $FX/prd-bad.md
    expect:
      exit: 1
      stdout: ['^FAIL', "missing section: 'personas'", "missing section: 'success metrics'", '(?i)gaps', 'TBD']
  - run: $PY $PACK/modes/prd/scripts/check_prd.py $FX/no-such.md
    expect: {exit: 1, stdout: 'not found'}
