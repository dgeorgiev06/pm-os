# pm-os core config. Harness- and model-neutral: nothing here assumes one vendor.
framework: pm-os
version: 0.2.0          # core version; packs declare `requires.core` against it
contract: task@1

paths:
  packs_file: packs.yaml  # installed packs (managed by `pmos pack add/remove`)
  skills: skills          # core skills and core principles
  roles: roles.yaml       # core roles
  agents: agents          # core agents: worker, operator, reviewer
  context: context
  state: state
  traces: traces
  outputs: outputs

cos_pack: cos           # which installed pack supplies the Chief of Staff (AGENTS.md is generated from it)

precedence: [local, org, third-party]   # how the CoS breaks ties between matching modes

# Model tiers are the ONLY place model ids live. Each adapter picks a provider.
tiers:
  anthropic: { small: claude-haiku-5-5, mid: claude-sonnet-5-5, top: claude-opus-5-5 }
  openai:    { small: "", mid: "", top: "" }   # fill in the ids you use
  google:    { small: "", mid: "", top: "" }

defaults:
  budget: { max_usd: 2.0, max_minutes: 30 }
  max_revisions: 2
  max_call_depth: 3

# Adapters turn the neutral sources into one harness's native config (`pmos render <adapter>`).
adapters:
  claude-code:
    provider: anthropic
    model_field: alias              # "alias" writes small/mid/top as haiku/sonnet/opus; "id" writes full ids
    aliases: { small: haiku, mid: sonnet, top: opus }
    agents_dir: .claude/agents
    skills_dir: .claude/skills
    # Map framework grants to this harness's tool names. This is what enforces the
    # permission line (Worker can't write to Jira). An agent whose grants map to
    # nothing inherits every tool, and `render` warns about it.
    grants_to_tools:
      docs:read: [Read, Grep, Glob]
      docs:write: [Write, Edit]
      shell:pmos: [Bash]
      jira:read: []          # e.g. mcp__jira__search_issues, mcp__jira__get_issue
      jira:write: []         # e.g. mcp__jira__create_issue, mcp__jira__update_issue
      comms:send: []         # e.g. mcp__slack__post_message
      repo:write: [Write, Edit]
      # Actions with a pack handler (pack.yaml `actions:`) run through `pmos action run` (shell:pmos).
  generic:
    provider: anthropic
    out_dir: build/generic   # one system prompt per agent + models.json, for any SDK or API

eval:
  # Any non-interactive command that reads a prompt file and prints the answer to stdout.
  # {prompt_file} is replaced with the path. Leave empty to only render prompts.
  command: ""   # e.g. "claude -p < {prompt_file}"  or  "my-runner --model mid {prompt_file}"
  # Grades each run: {grader_file} (grader.md) and {output_file} (the run's output.md) are replaced with
  # paths. It must print JSON {"passed": bool, "lines": [{"line": ..., "pass": bool}]}, saved as score.json;
  # build/evals/summary.json gets the pass rate. Run it on the reviewer's tier. Empty = no grading.
  grader_command: ""   # e.g. "claude -p --model sonnet \"$(cat {grader_file})\" < {output_file}"
