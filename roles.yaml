# Core roles. Pack roles live in packs/<pack>/roles.yaml and are addressed as <pack>/<role>.
# Skill and principle refs: bare = this pack ("core" here); other packs as <pack>:<path>.
roles:
  reviewer:
    agent: reviewer
    tier: mid
    effort: high              # a low-risk review runs one level lower; high risk never raises it
    persona: Independent reviewer. Judges the artifact against its checklist only, with evidence for every verdict; never sees the producer's reasoning.
    skills: [infra/envelope-io]
    context: []
    principles: []
    rubric: []
