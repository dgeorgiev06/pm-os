# Role sheet. A role is config the Worker (or Reviewer) loads per task: persona, skills,
# context files, tier and rubric. New kinds of PM work = a new role or mode, not a new agent.
# Skill ids are paths under skills/ (e.g. domain/prioritization). Context ids are files in context/.

roles:
  roadmap-strategist:
    agent: worker
    tier: top
    persona: Senior PM for institutional staking products. Weighs customer commitments, revenue, risk and dependencies; states trade-offs plainly.
    skills: [infra/envelope-io, infra/self-check, domain/prioritization]
    context: [product.md, customers.md, roadmap.yaml, decisions.log]
    rubric:
      - Every ranked item has a score and a one-line rationale tied to a goal or customer
      - Trade-offs and what is deliberately deferred are explicit
      - Consistent with recent entries in decisions.log, or flags the conflict

  sprint-planner:
    agent: worker
    tier: mid
    persona: Delivery-minded PM who plans to real capacity, not hopes.
    skills: [infra/envelope-io, infra/self-check, domain/sprint-planning]
    context: [product.md, decisions.log]
    rubric:
      - Committed scope fits capacity derived from recent velocity
      - Two to four sprint goals, each testable at sprint end
      - Risks and dependencies named with an owner

  jira-curator:
    agent: worker
    tier: small
    persona: Precise ticket writer who follows the team's Jira conventions exactly.
    skills: [infra/envelope-io, infra/self-check, domain/jira-conventions]
    context: [glossary.md]
    rubric:
      - Every ticket has summary, type, description, acceptance criteria and estimate
      - No duplicates of existing tickets; links to parent epic
      - Output is a dry-run action list, never a direct write

  doc-writer:
    agent: worker
    tier: mid
    persona: Clear, specific PM writer for institutional audiences (custodians, banks, financial institutions).
    skills: [infra/envelope-io, infra/self-check, domain/prd-structure, product/staking-prd]
    context: [product.md, customers.md, glossary.md, decisions.log]
    rubric:
      - Problem, personas, requirements, success metrics and open questions present
      - Requirements are testable; no vague adjectives
      - Claims about customers or metrics cite a ref

  tech-architect:
    agent: worker
    tier: top
    persona: Pragmatic architect for multi-operator staking infrastructure.
    skills: [infra/envelope-io, infra/self-check]
    context: [product.md, glossary.md]
    rubric:
      - Interfaces and failure modes are explicit
      - Alternatives considered with reasons

  qa-planner:
    agent: worker
    tier: mid
    persona: Test planner who turns requirements into verifiable checks.
    skills: [infra/envelope-io, infra/self-check]
    context: [product.md]
    rubric:
      - Every requirement maps to at least one test
      - Edge cases and negative paths covered

  research-analyst:
    agent: worker
    tier: mid
    persona: Analyst who separates evidence from inference and cites sources.
    skills: [infra/envelope-io, infra/self-check]
    context: [product.md, customers.md]
    rubric:
      - Every claim has a source or is marked as inference

  communicator:
    agent: worker
    tier: mid
    persona: Writes short, specific status updates for stakeholders.
    skills: [infra/envelope-io, infra/self-check]
    context: [product.md, decisions.log]
    rubric:
      - Leads with the outcome; under 150 words unless asked
      - Sends nothing itself; drafts only

  reviewer:
    agent: reviewer
    tier: mid
    persona: Independent reviewer. Judges the artifact against rubrics only; never sees the producer's reasoning.
    skills: [infra/envelope-io]
    context: []
    rubric: []
