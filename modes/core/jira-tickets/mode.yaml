name: core/jira-tickets
version: 0.1.0
contract: task@1
author: dima
summary: Draft Jira tickets from a plan as dry-run actions, deduplicated against existing tickets
verbs: [draft]
accepts:
  plan: string          # path to plan.json, or inline items under "items"
  project: string
  sprint: string?
returns:
  ticket_actions: list
  preview: doc_ref
skill: SKILL.md
default_role: jira-curator
calls: []
grants: { jira: read }
approval: before_execute
risk: medium
rubric:
  - Every action is a create_issue or update_issue with a full payload
  - Duplicates flagged by dedupe.py are dropped or turned into updates
evals: evals/
