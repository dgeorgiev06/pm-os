kind: conformance
name: overlay-from-context
covers: [script:scripts/pmos.py]
finding: request:overlays
severity: medium
desc: >-
  Without --product, the product comes from `product:` in context/product.md's frontmatter (the
  template has the field and keeps its prose), and the overlay follows from it.
steps:
  - name: the template has the field and keeps its prose
    run: 'true'
    expect: {files: {contains: {context/product.md: ['(?m)\A---\n(.*\n)*?product: ', '(?i)\*\*Product\*\*']}}}
  - run: $PY $FX/bin/yset.py context/product.md product staking --front && $PMOS task new --mode pm/prd --inputs '{"goal":"g"}'
    capture: {T: '(T-\d{8}-\d{3,})'}
    expect: {task: {id: $T, fields: {product: '^staking$', product_source: '^context$', overlay_skills: 'pm:product/staking-prd'}}}
  - run: $PMOS task show $T
    expect: {stdout: ['(?m)^- \[overlay: staking\] pm:product/staking-prd', '(?m)^- product: staking \(from context\)']}
