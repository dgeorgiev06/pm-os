kind: conformance
name: upgrade-rechecks-dependents
covers: [script:scripts/pmos.py]
finding: composability#3
owner: composability
severity: high
desc: >-
  Upgrading pm to 0.5.0 while gtm depends on pm@^0.4 is refused (naming gtm) unless --force, so
  dependents aren't silently broken.
setup:
  install: [gtm]
steps:
  - run: $PY $FX/bin/yset.py packs/pm/pack.yaml version 0.5.0
  - run: $PMOS pack add packs/pm --upgrade --approve-grants
    expect: {exit: nonzero, output: 'gtm'}
  - name: --force overrides
    run: $PMOS pack add packs/pm --upgrade --approve-grants --force
