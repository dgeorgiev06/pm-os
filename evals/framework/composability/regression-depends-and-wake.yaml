kind: conformance
name: regression-depends-and-wake
covers: [script:scripts/pmos.py]
finding: composability#good
owner: composability
severity: high
regression: true
desc: >-
  depends_on orders children (a dependent can't start before its dependency is done), and a waiting
  parent is re-queued once every child is terminal, including when they failed.
setup:
  install: [gtm]
steps:
  - run: $PMOS task new --mode gtm/launch-pack --verb plan --inputs '{"goal":"launch"}'
    capture: {L: '(T-\d{8}-\d{3,})'}
  - run: $PMOS task move $L running && $PMOS task new --parent $L --mode pm/prd --verb draft --inputs '{"goal":"g"}'
    capture: {A: '(T-\d{8}-\d{3,})'}
  - run: $PMOS task new --parent $L --mode pm/release-notes --verb draft --inputs '{"sprint":"2026-S22","project":"STK"}' --depends-on $A
    capture: {B: '(T-\d{8}-\d{3,})'}
  - run: $PMOS task move $B running
    expect: {exit: nonzero, output: '(?i)depend|unfinished'}
  - run: $PMOS task new --mode gtm/launch-pack --verb plan --inputs '{"goal":"second"}'
    capture: {M: '(T-\d{8}-\d{3,})'}
  - run: $PMOS task move $M running && $PMOS task new --parent $M --mode pm/prd --verb draft --inputs '{"goal":"g"}'
    capture: {C1: '(T-\d{8}-\d{3,})'}
  - run: $PMOS task new --parent $M --mode pm/release-notes --verb draft --inputs '{"sprint":"2026-S22","project":"STK"}'
    capture: {C2: '(T-\d{8}-\d{3,})'}
  - run: $PMOS task move $M waiting
  - run: $PMOS task move $C1 running && $PY $FX/bin/mkresult.py --task $C1 --status failed --submit
    expect:
      task: {id: $M, state: waiting}
  - run: $PMOS task move $C2 running && $PY $FX/bin/mkresult.py --task $C2 --status failed --submit
    expect:
      task: {id: $M, state: queued}
