kind: conformance
name: mode-default-acceptance
covers: [script:scripts/pmos.py]
finding: performance#6
owner: performance
severity: medium
desc: >-
  Modes declare default `acceptance` lines in mode.yaml; the envelope gets them when the CoS passes
  no --acceptance, so honest-self-check has something to check.
steps:
  - name: every installed mode declares acceptance
    run: |
      $PY - <<'PY'
      import glob, sys, yaml
      missing = [f for f in sorted(glob.glob("packs/*/modes/*/mode.yaml"))
                 if not (yaml.safe_load(open(f)) or {}).get("acceptance")]
      print("modes without acceptance:", missing)
      sys.exit(1 if missing else 0)
      PY
  - run: $PMOS task new --mode pm/prd --verb draft --inputs '{"goal":"g"}'
    capture: {T: '(T-\d{8}-\d{3,})'}
    expect:
      task: {id: $T, fields: {envelope.acceptance: '\["'}}
