kind: conformance
name: revision-counters-separate
covers: [script:scripts/pmos.py]
finding: performance#8
owner: performance
severity: low
desc: >-
  A PM "change X" (awaiting_approval -> revise) counts in `change_requests`, not in `revisions`,
  so it doesn't use up max_revisions (which counts failed reviews).
steps:
  - run: $PMOS task new --mode pm/prd --verb draft --inputs '{"goal":"g"}'
    capture: {T: '(T-\d{8}-\d{3,})'}
  - run: $PMOS task move $T running && $PY $FX/bin/mkresult.py --task $T --submit && $PY $FX/bin/advance.py --task $T --to awaiting_approval
  - run: $PMOS task move $T revise --note "PM - make it shorter"
    expect:
      task: {id: $T, state: revise, fields: {revisions: '^0$', change_requests: '^1$'}}
