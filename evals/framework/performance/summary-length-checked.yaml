kind: conformance
name: summary-length-checked
covers: [script:scripts/pmos.py]
finding: performance#6
owner: performance
severity: medium
desc: "`task result` refuses a summary over 80 words, before any Reviewer is spent."
steps:
  - run: $PMOS task new --mode pm/prd --verb draft --inputs '{"goal":"g"}'
    capture: {T: '(T-\d{8}-\d{3,})'}
  - run: $PMOS task move $T running
  - run: $PY $FX/bin/mkresult.py --task $T --summary "$(printf 'word %.0s' $(seq 85))" --submit
    expect: {exit: nonzero, output: '(?i)summary|words'}
  - run: $PY $FX/bin/mkresult.py --task $T --summary "$(printf 'word %.0s' $(seq 70))" --submit
    expect:
      task: {id: $T, state: in_review}
