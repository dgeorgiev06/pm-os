kind: conformance
name: gtm-children-respect-calls-and-pins
covers: [script:scripts/pmos.py]
finding: composability#1
owner: modularity
severity: high
desc: >-
  gtm/launch-pack calls pm/prd@^0.4 and pm/release-notes@^0.2. It must not start pm/jira-tickets or
  pm/sprint-planning children, and once pm/prd is 0.5.0 the ^0.4 pin must refuse it rather than
  silently resolving the newer version.
setup:
  install: [gtm]
steps:
  - run: $PMOS task new --mode gtm/launch-pack --verb plan --inputs '{"goal":"launch"}'
    capture: {L: '(T-\d{8}-\d{3,})'}
  - run: $PMOS task move $L running
  - name: pm/jira-tickets is not in launch-pack's calls
    run: $PMOS task new --parent $L --mode pm/jira-tickets --verb draft --inputs '{"plan":"outputs/plan.json","project":"STK"}'
    expect: {exit: nonzero, output: '(?i)\bcalls?\b'}
  - name: pm/sprint-planning is not in launch-pack's calls
    run: $PMOS task new --parent $L --mode pm/sprint-planning --verb plan --inputs '{"sprint":"2026-S22","project":"STK"}'
    expect: {exit: nonzero, output: '(?i)\bcalls?\b'}
  - name: pm/prd is in calls (guard)
    run: $PMOS task new --parent $L --mode pm/prd --verb draft --inputs '{"goal":"g"}'
    expect: {output: 'T-\d{8}-\d{3,}'}
  - name: pm moves to 0.5.0 (files and packs.yaml edited, no reinstall)
    run: |
      $PY $FX/bin/yset.py packs/pm/pack.yaml version 0.5.0 &&
      $PY $FX/bin/yset.py packs/pm/modes/prd/mode.yaml version 0.5.0 &&
      $PY $FX/bin/yset.py packs.yaml 'packs.[name=pm].version' 0.5.0
  - name: the ^0.4 pin no longer matches pm/prd 0.5.0
    run: $PMOS task new --parent $L --mode pm/prd --verb draft --inputs '{"goal":"g"}'
    expect: {exit: nonzero, output: '(?i)\bcalls?\b|\^0\.4|no installed mode|version'}
