name: artifact-outside-outputs-refused
finding: modularity#3
owner: modularity
severity: high
desc: Artifact refs must sit under outputs/<task id>/ (or be a scheme ref such as jira:STK-1).
steps:
  - run: $PMOS task new --mode pm/prd --verb draft --inputs '{"goal":"g"}'
    capture: {T: '(T-\d{8}-\d{3,})'}
  - run: $PMOS task move $T running
  - name: an artifact pointing into packs/
    run: $PY $FX/bin/mkresult.py --task $T --artifact packs/pm/pack.yaml --submit
    expect: {exit: nonzero, output: '(?i)outputs'}
  - name: another task's outputs folder
    run: mkdir -p outputs/T-19990101-001 && echo x > outputs/T-19990101-001/x.md && $PY $FX/bin/mkresult.py --task $T --artifact outputs/T-19990101-001/x.md --submit
    expect: {exit: nonzero, output: '(?i)outputs'}
  - name: own outputs folder and a scheme ref are fine
    run: echo x > outputs/$T/artifact.md && $PY $FX/bin/mkresult.py --task $T --artifact outputs/$T/artifact.md --artifact jira:STK-1 --submit
    expect:
      task: {id: $T, state: in_review}
