kind: conformance
name: regression-grant-widening-refused
covers: [script:scripts/pmos.py]
finding: modularity#good
owner: modularity
severity: high
regression: true
desc: >-
  A mode that widens its grants beyond its pack's approval is refused by validate and task new,
  and the upgrade asks for --approve-grants again.
steps:
  - name: set aside release-comms, which depends on pm@^0.4 and would block a 0.5 bump in this case
    run: $PMOS pack remove release-comms
  - run: $PY $FX/bin/yset.py packs/pm/modes/prd/mode.yaml grants.jira write
  - run: $PMOS validate
    expect: {exit: nonzero, output: 'approve-grants'}
  - run: $PMOS task new --mode pm/prd --verb draft --inputs '{"goal":"g"}'
    expect: {exit: nonzero, output: '(?i)grant'}
  - name: upgrade without --approve-grants
    run: $PY $FX/bin/yset.py packs/pm/pack.yaml version 0.5.0 && $PMOS pack add packs/pm --upgrade
    expect: {exit: nonzero, output: 'approve-grants'}
  - run: $PMOS pack add packs/pm --upgrade --approve-grants
  - run: $PMOS validate
  - run: $PMOS task new --mode pm/prd --verb draft --inputs '{"goal":"g"}'
